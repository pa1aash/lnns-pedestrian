# Job queue. Steps run sequentially, each with 4 worker processes; each step is resumable
# (finished job_ids are skipped). Finished steps are recorded in data/queue_state.json.
# queue.py reads this file once, at start: edits take effect only when the queue is restarted.
# Queue 2 (from 2026-11-08, after E5a): E7b_static, E7b_quench, E7b_barrier, E6a, E6b, E10, E7, E11, E8,
# E9, E6p. cpu_h for queue-2 steps: from the batch-4B smoke tests (reports/B4B_REPORT.md).
# Paths are relative to the repository root. cpu_h: estimated CPU-hours (see reports/B2A_REPORT.md;
# E2, BAR, E3 and E4 revised for plan change C15 in reports/B2C_REPORT.md).
steps:
  - name: E2
    cmd: [experiments/E2/e2_quench.py]
    depends: []
    cpu_h: 2.0  # the 26 snapshots added by C15; the original 34 are done
  - name: BAR
    cmd: [experiments/BAR/bar.py]
    depends: []
    cpu_h: 2.5  # 46 of 60 snapshots left
  - name: SEL_E3E4
    cmd: [experiments/selection.py, e3e4]
    depends: [BAR]
    cpu_h: 0.0
  - name: E3
    cmd: [experiments/E3/e3_dt.py]
    depends: [SEL_E3E4]
    cpu_h: 8.0  # upper bound 29 if every restart is censored
  - name: E4
    cmd: [experiments/E4/e4_escape.py]
    depends: [SEL_E3E4]
    cpu_h: 10.0  # upper bound 27.5 at 20 restarts if every restart is censored
  - name: E5b
    cmd: [experiments/E5/e5_sweep.py, E5b]
    depends: []
    cpu_h: 11.0
  - name: E7b_lib
    cmd: [experiments/E7b/e7b_lib.py]
    depends: []
    cpu_h: 4.5
  - name: E5a
    cmd: [experiments/E5/e5_sweep.py, E5a]
    depends: []
    cpu_h: 18.0
  - name: E7b_static
    cmd: [experiments/E7b/e7b_static.py]
    depends: [E7b_lib]
    cpu_h: 0.2
  - name: E7b_quench
    cmd: [experiments/E7b/e7b_quench.py]
    depends: [E7b_lib]
    cpu_h: 4.0
  - name: E7b_barrier
    cmd: [experiments/E7b/e7b_barrier.py]
    depends: [E7b_static]
    cpu_h: 5.0
  - name: E6a
    cmd: [experiments/E6/e6.py, E6a]
    depends: []
    cpu_h: 15.0
  - name: E6b
    cmd: [experiments/E6/e6.py, E6b]
    depends: [E6a, E5b]
    cpu_h: 3.0
  - name: E10
    cmd: [experiments/E10/e10_croma.py]
    depends: []
    cpu_h: 12.0  # the C1 + sigma* cell needs data/derived/sigma_star.json (E6b); without it E10 exits 3
  - name: E7
    cmd: [experiments/E7/e7_cells.py]
    depends: []
    cpu_h: 10.0
  - name: E11
    cmd: [experiments/E11/e11_overlap.py]
    depends: []
    cpu_h: 1.5
  - name: E8
    cmd: [experiments/E8/e8_counterflow.py]
    depends: []
    cpu_h: 15.0
  - name: E9
    cmd: [experiments/E9/e9_crossing.py]
    depends: []
    cpu_h: 12.0
  - name: E6p
    cmd: [experiments/E6/e6.py, E6p]
    depends: []
    cpu_h: 30.0
