# ...Legacy = against ORCA (legacy), else ORCA (RVO2); Whole = E6b vs E6a; PairLegacy/PairRvo = +b* vs ORCA.
# Diff = surrogate minus ORCA freed fraction; Lo/Hi = 95% cluster bootstrap, LoNinety/HiNinety = 90% (TOST);
# WinFrom/WinTo = window of T (s) containing the horizon where the 90% interval is inside +-0.10.
