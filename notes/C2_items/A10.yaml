# Registry entries for A10 (replay of the E2 noise quench with the noise stream held fixed).
# Source: data/derived/rev2_A10.json (experiments/revision2/A10_analyze.py, after queue step A10).
# Run level: 34 lone keystones x 5 noise seeds = 170 (reference, replay) pairs, sigma = 0.07 m/s.
RvAtenNRef: {file: rev2_A10.json, key: "ref_check.n_ref", fmt: "{:d}"}
RvAtenNRefMatch: {file: rev2_A10.json, key: "ref_check.n_match", fmt: "{:d}"}
RvAtenNPairs: {file: rev2_A10.json, key: "run.n_pairs", fmt: "{:d}"}
RvAtenRefFreed: {file: rev2_A10.json, key: "run.ref_freed", fmt: "{:d}"}
RvAtenReplayFreed: {file: rev2_A10.json, key: "run.replay_freed", fmt: "{:d}"}
RvAtenFlips: {file: rev2_A10.json, key: "run.flips", fmt: "{:d}"}
RvAtenFlipFrac: {file: rev2_A10.json, key: "run.flip.frac", fmt: sig, digits: 2}
RvAtenFlipLo: {file: rev2_A10.json, key: "run.flip.ci95_2sf.0", fmt: sig, digits: 2}
RvAtenFlipHi: {file: rev2_A10.json, key: "run.flip.ci95_2sf.1", fmt: sig, digits: 2}
RvAtenFlipRefOnly: {file: rev2_A10.json, key: "run.mcnemar.b_first_only", fmt: "{:d}"}
