RvAtenIndepDisagree: {file: rev2_A10.json, key: "run.indep_seed_disagree", fmt: sig, digits: 2}
RvAtenBothFreed: {file: rev2_A10.json, key: "run.n_both_freed", fmt: "{:d}"}
RvAtenSameExitTime: {file: rev2_A10.json, key: "run.n_same_exit_time", fmt: "{:d}"}
RvAtenShiftMedian: {file: rev2_A10.json, key: "run.shift_median_s", fmt: sig, digits: 2}
RvAtenShiftMax: {file: rev2_A10.json, key: "run.shift_max_s", fmt: sig, digits: 2}
